/goal_rotator_node:
  ros__parameters:
    pose_topic: "/goal_pose"
    goal_point_topic: "/goal_point"
    planner_status_topic: "/far_reach_goal_status"
    planner_cmd_vel_topic: "/cmd_vel"
    planner_cmd_vel_stamped_topic: "/cmd_vel"
    use_stamped_cmd_vel: true
    max_rotation_speed: 1.0
    min_rotation_speed: 0.2
    angle_tolerance: 3.0
    kp: 2.0
    target_distance_threshold: 0.1
    approach_rate_threshold: 0.03
    odom_topic: "/robot_odom"
    output_topic: "/cmd_vel_out"
    output_hz: 50.0
    min_nav_time: 5.0
    verbose: false